name: LITOS M7 Pages Cutover
# June 2025 doc-sheet-web phase audit.
# October 2025 full-block propagation audit.
# Retry after canonical 7749 deduplication.
# September 2025 full propagation guard.
# August 2025 full propagation guard.
# July 2025 full propagation guard.
# December 2025 full propagation guard.
# November 2025 full propagation guard.
# October 2025 full propagation guard.
# Force refresh after 7771 historical repair.
# Retry after delivery-date regression guard.
# Auto-rebuild after master-writing workflows.
# Force rebuild after 7903 master correction.
# Refresh after 2026 final-price integrity audit.
# Refresh after canonical 7917 master reconciliation.
# Refresh after focused 2026 delivery-date repair.
# Fresh build for pending-delivery-first trace ordering.
# Fresh build after historical delivery-date backfill.
# Updating this workflow intentionally forces a fresh sanitized feed build from the private master.
# Trace refresh: year-month ordering + overdue document review flag.
# Final gap-review refresh after validated delivery dates.
# Final 2026 trace refresh after delivery-link and date validation.
# Refresh after M6 link sanitation and operational-month trace fix.
# Refresh after phased historical delivery-date repair and native-Sheets support.

on:
  pull_request:
    paths:
      - 'python_feed/**'
      - '.github/workflows/pages-cutover.yml'
      - 'index.html'
      - 'privacy.html'
      - 'favicon.png'
      - 'dist/**'
      - 'oauth/**'
  push:
    branches:
      - main
    paths:
      - 'python_feed/**'
      - '.github/workflows/pages-cutover.yml'
      - 'index.html'
      - 'privacy.html'
      - 'favicon.png'
      - 'dist/**'
      - 'oauth/**'
  workflow_run:
    workflows:
      - 'LITOS Draft Sync'
      - 'LITOS M6 Albaranes Cutover'
      - 'LITOS Delivery Date Repair · 2026 Focus'
      - 'LITOS Final Price Audit · 2026'
      - 'LITOS Delivery Date Repair · Historical Phases'
      - 'LITOS 2026 Sent Recovery + Delivery Reconcile'
      - 'LITOS Client Intake'
      - 'LITOS M5 Organize Folders'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'build validates the artifact; deploy publishes it to GitHub Pages'
        required: true
        default: build
        type: choice
        options:
          - build
          - deploy
      confirm:
        description: 'For deploy type CUTOVER_M7'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: litos-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        run: pip install -r python_feed/requirements.txt

      - name: Compile M7 artifact code
        run: |
          python -m py_compile python_feed/feed.py
          python -m py_compile python_feed/export.py
          python -m py_compile python_feed/build_pages.py

      - name: Validate public-feed privacy sanitizer
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=python_feed python - <<'PY'
          from export import DOCUMENT_LINK_KEYS, sanitize_public_payload

          raw = {
              "version": 6,
              "generatedAt": "2026-09-17T00:00:00Z",
              "records": [{
                  "id": "TEST",
                  "model": "Lápida",
                  "invoiceFile": "https://drive.google.com/file/d/TEST/view",
                  "invoiceDraftFile": "https://docs.google.com/spreadsheets/d/DRAFT/edit",
                  "corelFile": "",
                  "noteFile": "https://drive.google.com/file/d/NOTE/view",
                  "attachmentFile": "",
              }],
              "expenses": [],
              "movements": [{
                  "year": 2026,
                  "date": "2026-09-01",
                  "sourceDate": "1/9/2026",
                  "type": "ENTREGA A CUENTA",
                  "ref": "—",
                  "line": None,
                  "concept": "—",
                  "debit": None,
                  "credit": 1000,
                  "balance": -1733,
              }],
          }
          payload = sanitize_public_payload(raw)
          assert payload["version"] == 12
          assert payload["movements"][0]["balance"] == -1733
          record = payload["records"][0]
          assert record["invoiceFile"].startswith("https://drive.google.com/")
          assert record["invoiceDraftFile"].startswith("https://docs.google.com/")
          assert record["noteFile"].startswith("https://drive.google.com/")
          assert DOCUMENT_LINK_KEYS.issubset(record)

          bad = {
              **raw,
              "records": [{**raw["records"][0], "invoiceFile": "https://example.com/not-google"}],
          }
          try:
              sanitize_public_payload(bad)
          except RuntimeError:
              pass
          else:
              raise AssertionError("non-Google document URL was not rejected")

          print("M7_PUBLIC_PRIVACY_SANITIZER_OK")
          PY

      - name: Validate static-only artifact with synthetic feed
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/m7-synthetic-feed.json" <<'JSON'
          {"version":12,"records":[{"id":"TEST","invoiceFile":"https://drive.google.com/file/d/TEST/view","invoiceDraftFile":"https://docs.google.com/spreadsheets/d/DRAFT/edit","corelFile":"","noteFile":"","attachmentFile":""}],"expenses":[],"movements":[{"year":2026,"date":"2026-09-01","sourceDate":"1/9/2026","type":"ENTREGA A CUENTA","ref":"—","line":null,"concept":"—","debit":null,"credit":1000,"balance":-1733}],"generatedAt":"2026-09-17T00:00:00Z"}
          JSON
          python python_feed/build_pages.py --output "$RUNNER_TEMP/m7-site" --feed "$RUNNER_TEMP/m7-synthetic-feed.json"
          test -s "$RUNNER_TEMP/m7-site/index.html"
          test -s "$RUNNER_TEMP/m7-site/favicon.png"
          test -s "$RUNNER_TEMP/m7-site/dist/app.js"
          test -s "$RUNNER_TEMP/m7-site/data/feed.json"
          grep -Fq 'const STATIC_DATA_FEED_URL = "./data/feed.json";' "$RUNNER_TEMP/m7-site/dist/app.js"
          grep -Fq 'static feed only; no Apps Script runtime dependency' "$RUNNER_TEMP/m7-site/dist/app.js"
          if grep -Fq 'script.google.com' "$RUNNER_TEMP/m7-site/dist/app.js"; then
            echo 'Unexpected Apps Script URL in staged runtime.' >&2
            exit 1
          fi
          if grep -Fq 'LEGACY_DATA_FEED_URL' "$RUNNER_TEMP/m7-site/dist/app.js"; then
            echo 'Unexpected legacy fallback constant in staged runtime.' >&2
            exit 1
          fi

  build:
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && vars.LITOS_PUBLIC_FEED_KILL_SWITCH == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      LITOS_FREE_ONLY: 'true'
      GOOGLE_OAUTH_USER_JSON: ${{ secrets.GOOGLE_OAUTH_USER_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm production deploy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' }}
        shell: bash
        run: |
          test "${{ inputs.confirm }}" = "CUTOVER_M7"
          echo 'OK: explicit M7 deploy confirmation received.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python_feed/requirements.txt

      - name: Install dependencies
        run: pip install -r python_feed/requirements.txt

      - name: Compile M7 artifact code
        run: |
          python -m py_compile python_feed/feed.py
          python -m py_compile python_feed/export.py
          python -m py_compile python_feed/build_pages.py

      - name: Read-only preflight
        run: python python_feed/feed.py --preflight

      - name: Require private OAuth
        shell: bash
        run: |
          test -n "$GOOGLE_OAUTH_USER_JSON"
          echo 'OK: private Google OAuth credential present.'

      - name: Generate privacy-sanitized ephemeral public feed
        run: python python_feed/export.py --output "$RUNNER_TEMP/litos-feed.json"

      - name: Build Pages artifact without Git data snapshots
        run: python python_feed/build_pages.py --output _site --feed "$RUNNER_TEMP/litos-feed.json"

      - name: Validate staged site and public-feed privacy
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/favicon.png
          test -s _site/dist/app.js
          test -s _site/data/feed.json
          grep -Fq 'const STATIC_DATA_FEED_URL = "./data/feed.json";' _site/dist/app.js
          grep -Fq 'static feed only; no Apps Script runtime dependency' _site/dist/app.js
          if grep -Fq 'script.google.com' _site/dist/app.js; then
            echo 'Unexpected Apps Script URL in staged runtime.' >&2
            exit 1
          fi
          if grep -Fq 'LEGACY_DATA_FEED_URL' _site/dist/app.js; then
            echo 'Unexpected legacy fallback constant in staged runtime.' >&2
            exit 1
          fi
          PYTHONPATH=python_feed python - <<'PY'
          import json
          from pathlib import Path
          from export import DOCUMENT_LINK_KEYS, assert_public_payload_safe

          payload = json.loads(Path('_site/data/feed.json').read_text(encoding='utf-8'))
          assert payload.get('version') == 12
          assert isinstance(payload.get('records'), list) and payload['records']
          assert isinstance(payload.get('expenses'), list)
          assert isinstance(payload.get('movements'), list) and payload['movements']
          assert isinstance(payload['movements'][-1].get('balance'), (int, float))
          assert_public_payload_safe(payload)

          # Phase-2026 propagation guard: verify the private-master correction
          # actually reaches the public feed consumed by the website.
          by_id = {str(record.get("id")): record for record in payload["records"]}
          record_7903 = by_id.get("7903")
          assert record_7903 is not None, "7903 missing from staged public feed"
          assert record_7903.get("deliveryDocumentDate") == "2026-08-31", (
              f"7903 delivery date did not propagate: {record_7903.get('deliveryDocumentDate')!r}"
          )
          assert abs(float(record_7903.get("finalPrice")) - 449.31) < 0.01, (
              f"7903 final price did not propagate: {record_7903.get('finalPrice')!r}"
          )
          print(
              "M7_7903_PROPAGATION_OK "
              f"delivery={record_7903.get('deliveryDocumentDate')} "
              f"finalPrice={record_7903.get('finalPrice')}"
          )

          record_7885 = by_id.get("7885")
          assert record_7885 is not None, "7885 missing from staged public feed"
          assert not record_7885.get("deliveryDocumentDate"), (
              f"7885 must not expose an unvalidated delivery date: {record_7885.get('deliveryDocumentDate')!r}"
          )
          assert record_7885.get("deliveryReviewStatus") == "Revisión manual · conflicto documental", (
              f"7885 review status did not propagate: {record_7885.get('deliveryReviewStatus')!r}"
          )
          assert abs(float(record_7885.get("finalPrice")) - 589.99) < 0.01, (
              f"7885 final price did not propagate: {record_7885.get('finalPrice')!r}"
          )

          record_7904 = by_id.get("7904")
          assert record_7904 is not None, "7904 missing from staged public feed"
          assert not record_7904.get("deliveryDocumentDate"), (
              f"7904 unexpectedly has a delivery date: {record_7904.get('deliveryDocumentDate')!r}"
          )
          assert record_7904.get("deliveryReviewStatus") == "Pendiente revisión · falta albarán definitivo", (
              f"7904 review status did not propagate: {record_7904.get('deliveryReviewStatus')!r}"
          )
          print(
              "M7_DELIVERY_REVIEW_STATUS_OK "
              f"7885={record_7885.get('deliveryReviewStatus')} "
              f"7904={record_7904.get('deliveryReviewStatus')}"
          )

          record_7923 = by_id.get("7923")
          assert record_7923 is not None, "7923 missing from staged public feed"
          assert record_7923.get("deliveryReviewStatus") == "Pendiente · mes en curso", (
              f"7923 current-month status did not propagate: {record_7923.get('deliveryReviewStatus')!r}"
          )
          assert not record_7923.get("deliveryDocumentDate"), (
              f"7923 unexpectedly has a delivery date: {record_7923.get('deliveryDocumentDate')!r}"
          )
          print(
              "M7_CURRENT_MONTH_STATUS_OK "
              f"7923={record_7923.get('deliveryReviewStatus')}"
          )

          records_7878 = [record for record in payload["records"] if str(record.get("id")) == "7878"]
          assert len(records_7878) == 1, f"7878 expected once, got {len(records_7878)}"
          record_7878 = records_7878[0]
          assert not record_7878.get("deliveryDocumentDate"), (
              f"7878 must not expose order date as delivery date: {record_7878.get('deliveryDocumentDate')!r}"
          )
          assert "sin fecha entrega diferenciada" in str(record_7878.get("deliveryReviewStatus", "")).lower(), (
              f"7878 review status did not propagate: {record_7878.get('deliveryReviewStatus')!r}"
          )
          assert abs(float(record_7878.get("finalPrice")) - 119.89) < 0.01, (
              f"7878 final price did not propagate: {record_7878.get('finalPrice')!r}"
          )

          records_7896 = [record for record in payload["records"] if str(record.get("id")) == "7896"]
          assert len(records_7896) == 1, f"7896 expected once, got {len(records_7896)}"
          record_7896 = records_7896[0]
          assert record_7896.get("deliveryDocumentDate") == "2026-07-28", (
              f"7896 delivery document date mismatch: {record_7896.get('deliveryDocumentDate')!r}"
          )
          assert record_7896.get("deliveredDate") == "2026-07-29", (
              f"7896 estadillo delivery mismatch: {record_7896.get('deliveredDate')!r}"
          )
          assert abs(float(record_7896.get("finalPrice")) - 212.02) < 0.01, (
              f"7896 final price mismatch: {record_7896.get('finalPrice')!r}"
          )

          records_7898 = [record for record in payload["records"] if str(record.get("id")) == "7898"]
          assert len(records_7898) == 1, f"7898 duplicate remains in feed: {len(records_7898)} rows"
          record_7898 = records_7898[0]
          assert record_7898.get("deliveryDocumentDate") == "2026-07-28", (
              f"7898 delivery document date mismatch: {record_7898.get('deliveryDocumentDate')!r}"
          )
          assert abs(float(record_7898.get("finalPrice")) - 275.18) < 0.01, (
              f"7898 final price mismatch: {record_7898.get('finalPrice')!r}"
          )
          print(
              "M7_JUNE_JULY_PHASE_OK "
              f"7878={record_7878.get('deliveryReviewStatus')} "
              f"7896={record_7896.get('deliveryDocumentDate')}/{record_7896.get('deliveredDate')} "
              f"7898_count={len(records_7898)}"
          )

          record_7856 = by_id.get("7856")
          assert record_7856 is not None, "7856 missing from staged public feed"
          assert record_7856.get("deliveryDocumentDate") == "2026-04-23", (
              f"7856 delivery date mismatch: {record_7856.get('deliveryDocumentDate')!r}"
          )
          assert abs(float(record_7856.get("finalPrice")) - 483.14) < 0.01, (
              f"7856 final price mismatch: {record_7856.get('finalPrice')!r}"
          )

          record_7858 = by_id.get("7858")
          assert record_7858 is not None, "7858 missing from staged public feed"
          assert record_7858.get("deliveryDocumentDate") == "2026-04-30", (
              f"7858 delivery date mismatch: {record_7858.get('deliveryDocumentDate')!r}"
          )
          assert abs(float(record_7858.get("finalPrice")) - 285.09) < 0.01, (
              f"7858 final price mismatch: {record_7858.get('finalPrice')!r}"
          )

          record_7859 = by_id.get("7859")
          assert record_7859 is not None, "7859 missing from staged public feed"
          assert not record_7859.get("deliveryDocumentDate"), (
              f"7859 unexpectedly has delivery date: {record_7859.get('deliveryDocumentDate')!r}"
          )
          assert "falta albarán definitivo" in str(record_7859.get("deliveryReviewStatus", "")).lower(), (
              f"7859 status mismatch: {record_7859.get('deliveryReviewStatus')!r}"
          )

          for conflict_id, expected_price in (("7862", 498.36), ("7869", 580.52)):
              record = by_id.get(conflict_id)
              assert record is not None, f"{conflict_id} missing from staged public feed"
              assert not record.get("deliveryDocumentDate"), (
                  f"{conflict_id} must not expose invalid delivery date: {record.get('deliveryDocumentDate')!r}"
              )
              assert "conflicto documental" in str(record.get("deliveryReviewStatus", "")).lower(), (
                  f"{conflict_id} status mismatch: {record.get('deliveryReviewStatus')!r}"
              )
              assert abs(float(record.get("finalPrice")) - expected_price) < 0.01, (
                  f"{conflict_id} final price mismatch: {record.get('finalPrice')!r}"
              )

          expected_visual_dates = {
              "7865": ("2026-05-12", 300.36),
              "7866": ("2026-05-12", 325.60),
              "7871": ("2026-05-25", 182.99),
          }
          for work_id, (expected_date, expected_price) in expected_visual_dates.items():
              record = by_id.get(work_id)
              assert record is not None, f"{work_id} missing from staged public feed"
              assert record.get("deliveryDocumentDate") == expected_date, (
                  f"{work_id} delivery date mismatch: {record.get('deliveryDocumentDate')!r}"
              )
              assert abs(float(record.get("finalPrice")) - expected_price) < 0.01, (
                  f"{work_id} final price mismatch: {record.get('finalPrice')!r}"
              )

          print(
              "M7_APRIL_MAY_PHASE_OK "
              f"7856={record_7856.get('deliveryDocumentDate')} "
              f"7858={record_7858.get('deliveryDocumentDate')} "
              f"7859={record_7859.get('deliveryReviewStatus')} "
              f"7862={by_id['7862'].get('deliveryReviewStatus')} "
              f"7869={by_id['7869'].get('deliveryReviewStatus')}"
          )

          record_7818 = by_id.get("7818")
          assert record_7818 is not None, "7818 missing from staged public feed"
          assert not record_7818.get("deliveryDocumentDate"), (
              f"7818 unexpectedly has a delivery date: {record_7818.get('deliveryDocumentDate')!r}"
          )
          assert "falta albarán definitivo" in str(record_7818.get("deliveryReviewStatus", "")).lower(), (
              f"7818 status mismatch: {record_7818.get('deliveryReviewStatus')!r}"
          )
          assert record_7818.get("finalPrice") in (None, "", 0), (
              f"7818 must not expose a final price without definitive albarán: {record_7818.get('finalPrice')!r}"
          )

          record_7824 = by_id.get("7824")
          assert record_7824 is not None, "7824 missing from staged public feed"
          assert record_7824.get("deliveryDocumentDate") == "2026-02-03", (
              f"7824 delivery date mismatch: {record_7824.get('deliveryDocumentDate')!r}"
          )
          assert abs(float(record_7824.get("finalPrice")) - 239.15) < 0.01, (
              f"7824 final price mismatch: {record_7824.get('finalPrice')!r}"
          )

          record_7841 = by_id.get("7841")
          assert record_7841 is not None, "7841 missing from staged public feed"
          assert not record_7841.get("deliveryDocumentDate"), (
              f"7841 must not expose invalid delivery date: {record_7841.get('deliveryDocumentDate')!r}"
          )
          assert "conflicto documental" in str(record_7841.get("deliveryReviewStatus", "")).lower(), (
              f"7841 status mismatch: {record_7841.get('deliveryReviewStatus')!r}"
          )
          assert abs(float(record_7841.get("finalPrice")) - 151.44) < 0.01, (
              f"7841 final price mismatch: {record_7841.get('finalPrice')!r}"
          )

          expected_q1_dates = {
              "7822": ("2026-01-22", 100.96),
              "7834": ("2026-02-16", 376.08),
              "7847": ("2026-03-05", 361.55),
              "7819": ("2026-01-16", 75.72),
              "7831": ("2026-02-17", 208.23),
              "7837": ("2026-03-11", 1055.03),
              "7846": ("2026-03-30", 302.00),
              "7849": ("2026-03-27", 100.96),
          }
          for work_id, (expected_date, expected_price) in expected_q1_dates.items():
              record = by_id.get(work_id)
              assert record is not None, f"{work_id} missing from staged public feed"
              assert record.get("deliveryDocumentDate") == expected_date, (
                  f"{work_id} delivery date mismatch: {record.get('deliveryDocumentDate')!r}"
              )
              assert abs(float(record.get("finalPrice")) - expected_price) < 0.01, (
                  f"{work_id} final price mismatch: {record.get('finalPrice')!r}"
              )

          print(
              "M7_JAN_MAR_PHASE_OK "
              f"7818={record_7818.get('deliveryReviewStatus')} "
              f"7824={record_7824.get('deliveryDocumentDate')} "
              f"7841={record_7841.get('deliveryReviewStatus')} "
              f"7847={by_id['7847'].get('deliveryDocumentDate')}"
          )

          record_7771 = by_id.get("7771")
          assert record_7771 is not None, "7771 missing from staged public feed"
          assert record_7771.get("deliveryDocumentDate") == "2025-10-07", (
              f"7771 delivery date mismatch: {record_7771.get('deliveryDocumentDate')!r}"
          )
          assert abs(float(record_7771.get("finalPrice")) - 230.95) < 0.01, (
              f"7771 final price mismatch: {record_7771.get('finalPrice')!r}"
          )
          print(
              "M7_7771_CASE_OK "
              f"delivery={record_7771.get('deliveryDocumentDate')} "
              f"finalPrice={record_7771.get('finalPrice')}"
          )

          expected_oct_2025 = {
              "7768": ("2025-10-03", 324.42),
              "7771": ("2025-10-07", 230.95),
              "7775": ("2025-10-07", 126.20),
              "7778": ("2025-10-07", 265.65),
              "7782": ("2025-10-07", 119.89),
              "7752": ("2025-10-10", 201.92),
              "7776": ("2025-10-10", 255.08),
              "7777": ("2025-10-10", 283.24),
              "7783": ("2025-10-10", 95.74),
              "7761": ("2025-10-15", 309.74),
              "7766": ("2025-10-15", 419.56),
              "7767": ("2025-10-15", 376.08),
              "7757": ("2025-10-20", 204.44),
              "7772": ("2025-10-20", 274.86),
              "7773": ("2025-10-20", 355.71),
              "7774": ("2025-10-20", 300.36),
              "7779": ("2025-10-24", 306.67),
              "7780": ("2025-10-24", 266.38),
              "7781": ("2025-10-29", 281.43),
              "7785": ("2025-10-29", 238.17),
              "7786": ("2025-10-29", 277.42),
          }
          for work_id, (expected_date, expected_price) in expected_oct_2025.items():
              matches = [record for record in payload["records"] if str(record.get("id")) == work_id]
              assert len(matches) == 1, f"{work_id} expected once in feed, got {len(matches)}"
              record = matches[0]
              assert record.get("deliveryDocumentDate") == expected_date, (
                  f"{work_id} October-2025 delivery mismatch: {record.get('deliveryDocumentDate')!r}"
              )
              assert abs(float(record.get("finalPrice")) - expected_price) < 0.01, (
                  f"{work_id} October-2025 final price mismatch: {record.get('finalPrice')!r}"
              )
          print(
              "M7_OCT_2025_PHASE_OK "
              f"records={len(expected_oct_2025)} "
              f"first={by_id['7768'].get('deliveryDocumentDate')} "
              f"last={by_id['7786'].get('deliveryDocumentDate')}"
          )

          expected_jun_2025 = {
              "7696": ("2025-06-02", 388.70),
              "7697": ("2025-06-02", 195.61),
              "7703": ("2025-06-04", 297.19),
