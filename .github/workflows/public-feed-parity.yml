# Historical filename retained; this workflow now audits the current static feed only.
name: LITOS M7 Public Feed Audit

on:
  push:
    paths:
      - 'python_feed/**'
      - '.github/workflows/public-feed-parity.yml'
  pull_request:
    paths:
      - 'python_feed/**'
      - '.github/workflows/public-feed-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      LITOS_FREE_ONLY: 'true'
      GOOGLE_OAUTH_USER_JSON: ${{ secrets.GOOGLE_OAUTH_USER_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python_feed/requirements.txt

      - name: Install dependencies
        run: pip install -r python_feed/requirements.txt

      - name: Compile M7 feed code
        run: |
          python -m py_compile python_feed/feed.py
          python -m py_compile python_feed/export.py

      - name: Read-only preflight
        run: python python_feed/feed.py --preflight

      - name: Require private OAuth for manual audit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          test -n "$GOOGLE_OAUTH_USER_JSON"
          echo 'OK: private Google OAuth credential present.'

      - name: Generate and validate current sanitized feed
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          python python_feed/export.py --output "$RUNNER_TEMP/litos-feed.json"
          PYTHONPATH=python_feed python - "$RUNNER_TEMP/litos-feed.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from export import assert_public_payload_safe

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload.get("version") == 10
          assert isinstance(payload.get("records"), list) and payload["records"]
          assert isinstance(payload.get("expenses"), list)
          assert isinstance(payload.get("movements"), list)
          assert_public_payload_safe(payload)
          print(
              "M7_PUBLIC_FEED_AUDIT_OK "
              f"records={len(payload['records'])} "
              f"expenses={len(payload['expenses'])} "
              f"movements={len(payload['movements'])}"
          )
          PY
