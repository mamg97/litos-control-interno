name: LITOS Saban Intake

on:
  push:
    paths:
      - 'python_saban/**'
      - '.github/workflows/saban-intake.yml'
  pull_request:
    paths:
      - 'python_saban/**'
      - '.github/workflows/saban-intake.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - dry-run

permissions:
  contents: read

concurrency:
  group: litos-saban-intake
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python_saban
    env:
      PYTHONUNBUFFERED: "1"
      LITOS_FREE_ONLY: "true"
      LITOS_SABAN_WRITE_ENABLED: "false"
      LITOS_SPREADSHEET_ID: "1ZS-L0eJmfukNr0rmc8ZvC3UxdVKw7Rnggx5TlRydZ2Q"
      LITOS_SABAN_FOLDER_ID: "1eUAupqLzfBhkiEexWqpI3JtYReT8c9A_"
      LITOS_SABAN_LABEL: "saban"
      LITOS_SABAN_YEAR: "2026"
      LITOS_SABAN_LOOKBACK_DAYS: "30"
      GOOGLE_OAUTH_SABAN_JSON: ${{ secrets.GOOGLE_OAUTH_SABAN_JSON }}
      SABAN_ALLOWED_SENDER: ${{ secrets.SABAN_ALLOWED_SENDER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_saban/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read-only preflight
        run: python runner.py --preflight

      - name: Require private Saban secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        shell: bash
        run: |
          test -n "$GOOGLE_OAUTH_SABAN_JSON"
          test -n "$SABAN_ALLOWED_SENDER"
          echo "OK: private Saban credentials are present."

      - name: Fresh Gmail/Drive/Sheets dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: python runner.py --dry-run
