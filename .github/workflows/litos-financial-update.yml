name: Apply LITOS draft invoice support

on:
  push:
    paths:
      - .github/workflows/litos-financial-update.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch draft invoice support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {n}")
              return text.replace(old, new, 1)

          # ---- Apps Script feed / Drive document index ----
          p = Path("apps-script/Code.gs")
          s = p.read_text(encoding="utf-8")

          if 'invoiceDraft: "Factura borrador (XLSX)"' not in s:
              s = once(
                  s,
                  '  invoice: "Archivo factura / albarán (XLSX)",\n',
                  '  invoice: "Archivo factura / albarán (XLSX)",\n  invoiceDraft: "Factura borrador (XLSX)",\n',
                  "draft document field",
              )

          if 'CURRENT_DOCUMENTS_FOLDER_ID' not in s:
              s = once(
                  s,
                  'const HISTORIC_DOCUMENTS_FOLDER_ID = "1RjvspVx85xu8BbisLjwDMToS148rfJ7-";\n',
                  'const HISTORIC_DOCUMENTS_FOLDER_ID = "1RjvspVx85xu8BbisLjwDMToS148rfJ7-";\nconst CURRENT_DOCUMENTS_FOLDER_ID = "1eUAupqLzfBhkiEexWqpI3JtYReT8c9A_";\n',
                  "current documents folder",
              )

          s = s.replace("    version: 5,", "    version: 6,", 1)

          if 'const currentDocuments = currentDocumentIndex_();' not in s:
              s = once(
                  s,
                  '  const richValues = sheet.getDataRange().getRichTextValues();\n',
                  '  const richValues = sheet.getDataRange().getRichTextValues();\n  const currentDocuments = currentDocumentIndex_();\n',
                  "live document index",
              )

          if 'const liveDocuments = currentDocuments.get(id);' not in s:
              s = once(
                  s,
                  '    const rawMaterial = read(row, FIELDS.material);\n    return {\n',
                  '    const rawMaterial = read(row, FIELDS.material);\n    const liveDocuments = currentDocuments.get(id);\n    const liveDocument = (type, field) => liveDocuments ? clean_(liveDocuments[type]) : readLink(rowIndex, field);\n    return {\n',
                  "live document selection",
              )

          if 'invoiceDraftFile:' not in s:
              s = once(
                  s,
                  '      invoiceFile: readLink(rowIndex, DOCUMENT_FIELDS.invoice),\n',
                  '      invoiceFile: liveDocument("invoice", DOCUMENT_FIELDS.invoice),\n      invoiceDraftFile: liveDocument("invoiceDraft", DOCUMENT_FIELDS.invoiceDraft),\n',
                  "feed draft invoice link",
              )

          if 'function currentDocumentIndex_()' not in s:
              marker = 'function indexHistoricalDocuments_() {'
              helper = '''function currentDocumentIndex_() {
            const cache = CacheService.getScriptCache();
            const key = "litos-current-documents-v1";
            const cached = cache.get(key);
            if (cached) {
              try { return new Map(Object.entries(JSON.parse(cached))); } catch (error) { /* rebuild below */ }
            }
            const documents = indexCurrentDocuments_();
            try { cache.put(key, JSON.stringify(Object.fromEntries(documents)), 300); } catch (error) { /* cache is optional */ }
            return documents;
          }

          function indexCurrentDocuments_() {
            const folder = DriveApp.getFolderById(CURRENT_DOCUMENTS_FOLDER_ID);
            const files = [];
            collectFiles_(folder, files, {});
            const documents = new Map();
            files.forEach((file) => {
              const match = clean_(file.getName()).match(/(?:^|[^0-9])(\\d{4})(?:[^0-9]|$)/);
              if (!match) return;
              const id = match[1];
              const type = classifyDocument_(file.getName(), id);
              if (!type) return;
              const entry = documents.get(id) || {};
              if (!entry[type]) entry[type] = file.getUrl();
              documents.set(id, entry);
            });
            return documents;
          }

          '''
              s = once(s, marker, helper + marker, "current document helpers")

          if 'return "invoiceDraft";' not in s:
              s = once(
                  s,
                  '  if (["xlsx", "xls"].includes(ext)) return "invoice";\n',
                  '  if (["xlsx", "xls"].includes(ext)) {\n    if (/(?:^|[-_ ])borrador(?:[-_ .]|$)/.test(normalized)) return "invoiceDraft";\n    return "invoice";\n  }\n',
                  "draft filename classifier",
              )

          # Keep the maintenance command able to populate the new draft column too.
          if 'makeLink(links.invoiceDraft)' not in s:
              s = once(
                  s,
                  '    return [makeLink(links.invoice), makeLink(links.corel), makeLink(links.note), makeLink(links.attachments)];\n',
                  '    return [makeLink(links.invoice), makeLink(links.invoiceDraft), makeLink(links.corel), makeLink(links.note), makeLink(links.attachments)];\n',
                  "populate draft result",
              )
              s = once(
                  s,
                  '    DOCUMENT_FIELDS.invoice,\n    DOCUMENT_FIELDS.corel,\n',
                  '    DOCUMENT_FIELDS.invoice,\n    DOCUMENT_FIELDS.invoiceDraft,\n    DOCUMENT_FIELDS.corel,\n',
                  "populate draft target",
              )

          p.write_text(s, encoding="utf-8")

          # ---- Frontend ----
          p = Path("dist/app.js")
          s = p.read_text(encoding="utf-8")

          if '"Factura borrador (XLSX)": text(record.invoiceDraftFile)' not in s:
              s = once(
                  s,
                  '    "Archivo factura / albarán (XLSX)": text(record.invoiceFile),\n',
                  '    "Archivo factura / albarán (XLSX)": text(record.invoiceFile),\n    "Factura borrador (XLSX)": text(record.invoiceDraftFile),\n',
                  "frontend draft mapping",
              )

          if 'const draftInvoiceUrl = order["Factura borrador (XLSX)"];' not in s:
              pattern = re.compile(
                  r'''\n\s*\[\s*order\["Archivo factura / albarán \(XLSX\)"\],\s*order\["Archivo Corel \(CDR\)"\],\s*order\.Notas \|\| order\["Nota manuscrita"\],\s*order\["Imágenes anejas"\]\s*\]\.forEach\(\(url\) => \{\s*const cell = document\.createElement\("td"\);\s*if \(url\) \{\s*const link = document\.createElement\("a"\);\s*link\.href = url;\s*link\.target = "_blank";\s*link\.rel = "noopener noreferrer";\s*link\.textContent = "Abrir";\s*cell\.append\(link\);\s*\} else \{\s*cell\.textContent = "No disponible";\s*\}\s*row\.append\(cell\);\s*\}\);''',
                  re.S,
              )
              replacement = '''
            const invoiceUrl = order["Archivo factura / albarán (XLSX)"];
            const draftInvoiceUrl = order["Factura borrador (XLSX)"];
            [
              { url: invoiceUrl || draftInvoiceUrl, label: invoiceUrl ? "Abrir" : draftInvoiceUrl ? "Abrir borrador" : "", draft: !invoiceUrl && Boolean(draftInvoiceUrl) },
              { url: order["Archivo Corel (CDR)"], label: "Abrir" },
              { url: order.Notas || order["Nota manuscrita"], label: "Abrir" },
              { url: order["Imágenes anejas"], label: "Abrir" }
            ].forEach((documentInfo) => {
              const cell = document.createElement("td");
              if (documentInfo.url) {
                const link = document.createElement("a");
                link.href = documentInfo.url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = documentInfo.label;
                if (documentInfo.draft) {
                  link.dataset.documentStatus = "draft";
                  link.title = "Borrador: al quitar _borrador del nombre del archivo pasará a definitiva";
                }
                cell.append(link);
              } else {
                cell.textContent = "No disponible";
              }
              row.append(cell);
            });'''
              s2, n = pattern.subn(replacement, s, count=1)
              if n != 1:
                  raise SystemExit(f"trace draft renderer: expected 1 match, found {n}")
              s = s2

          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate draft support
        run: |
          node --check dist/app.js
          git diff --check
          grep -q 'invoiceDraft: "Factura borrador (XLSX)"' apps-script/Code.gs
          grep -q 'return "invoiceDraft"' apps-script/Code.gs
          grep -q 'currentDocumentIndex_' apps-script/Code.gs
          grep -q 'Abrir borrador' dist/app.js

      - name: Commit draft support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs dist/app.js
          git commit -m "Add draft invoice workflow and status"
          git push
