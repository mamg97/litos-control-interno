name: LITOS M6 Total Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - 'python_albaranes/diagnose.py'
      - '.github/workflows/albaranes-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      LITOS_FREE_ONLY: "true"
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets[format('GOOGLE_OAUTH_{0}{1}_JSON', 'SA', 'BAN')] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_albaranes/requirements.txt

      - name: Install dependencies
        run: pip install -r python_albaranes/requirements.txt

      - name: Compile diagnostic
        run: python -m py_compile python_albaranes/parity.py python_albaranes/diagnose.py

      - name: Require private OAuth
        shell: bash
        run: |
          test -n "$GOOGLE_OAUTH_CLIENT_JSON"
          echo "OK: private Google OAuth credential present."

      - name: Diagnose total mismatches read-only
        working-directory: python_albaranes
        run: python diagnose.py
