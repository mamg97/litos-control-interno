name: LITOS Delivery Date Backfill · 2023
# phase-4 semantics: validated definitive albaran FECHA is delivery date
# annual phases use linked/catalog candidates; orphan scan is a separate final phase
# rerun after canonical delivery-date rule

on:
  push:
    paths:
      - '.github/workflows/delivery-date-backfill-once.yml'

permissions:
  contents: read

concurrency:
  group: litos-delivery-date-backfill-2023
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      LITOS_FREE_ONLY: "true"
      LITOS_DELIVERY_READ_WORKERS: "8"
      GOOGLE_OAUTH_USER_JSON: ${{ secrets.GOOGLE_OAUTH_USER_JSON }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_albaranes/requirements.txt
      - run: pip install -r python_albaranes/requirements.txt
      - name: Compile
        run: python -m py_compile python_albaranes/delivery_date_backfill.py
      - name: Phase 4 pre-write audit · 2023
        run: python python_albaranes/delivery_date_backfill.py --dry-run --year 2023
      - name: Phase 4 write · 2023
        env:
          LITOS_DELIVERY_DATE_WRITE_ENABLED: "true"
        run: python python_albaranes/delivery_date_backfill.py --sync --year 2023 --confirm DELIVERY_DATE_BACKFILL_V1
      - name: Phase 4 post-write audit · 2023
        run: python python_albaranes/delivery_date_backfill.py --dry-run --year 2023
