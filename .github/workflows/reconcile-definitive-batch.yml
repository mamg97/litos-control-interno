name: LITOS One-off Multi-order Intake Reconciliation

on:
  push:
    paths:
      - '.github/workflows/reconcile-definitive-batch.yml'

permissions:
  contents: read

concurrency:
  group: litos-m3-one-off-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      LITOS_FREE_ONLY: "true"
      LITOS_CLIENT_WRITE_ENABLED: "true"
      LITOS_SPREADSHEET_ID: "1ZS-L0eJmfukNr0rmc8ZvC3UxdVKw7Rnggx5TlRydZ2Q"
      LITOS_CLIENT_FOLDER_ID: "1eUAupqLzfBhkiEexWqpI3JtYReT8c9A_"
      LITOS_CLIENT_YEAR: "2026"
      LITOS_CLIENT_LOOKBACK_DAYS: "7"
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_client_intake/requirements.txt
      - run: pip install -r python_client_intake/requirements.txt
      - name: Compile
        run: python -m py_compile python_client_intake/intake_readonly.py python_client_intake/intake_sync.py python_client_intake/intake_sync_safe.py
      - name: Reconcile recent multi-order attachment batches
        working-directory: python_client_intake
        run: python intake_sync.py --delivery-batches-only --multi-order-only
