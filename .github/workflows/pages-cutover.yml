name: LITOS M7 Pages Cutover
# Security containment: this publicly hosted site must not export workshop data.
on:
  pull_request:
    paths: ['.github/workflows/pages-cutover.yml', 'python_feed/**']
  push:
    branches: [main]
    paths: ['.github/workflows/pages-cutover.yml', 'python_feed/**', 'index.html', 'privacy.html', 'dist/**']
  workflow_run:
    workflows:
      - 'LITOS M6 Albaranes Cutover'
      - 'LITOS Delivery Date Repair · 2026 Focus'
      - 'LITOS Final Price Audit · 2026'
      - 'LITOS Delivery Date Repair · Historical Phases'
      - 'LITOS 2026 Sent Recovery + Delivery Reconcile'
      - 'LITOS Client Intake'
      - 'LITOS M5 Organize Folders'
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: litos-pages-security
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public OAuth policy documents only
        uses: actions/checkout@v4
      - name: Stage a public-safe site, without private data or credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data _site/oauth/privacy
          cp privacy.html _site/privacy.html
          cp oauth/index.html _site/oauth/index.html
          cp oauth/privacy/index.html _site/oauth/privacy/index.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <title>LITOS Control Interno · Acceso restringido</title>
            <style>
              body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8f7;color:#112b34;font:16px system-ui,sans-serif}
              main{max-width:540px;padding:36px;line-height:1.6}
              h1{font-size:1.7rem;line-height:1.2}
            </style>
          </head>
          <body><main>
            <h1>LITOS Control Interno</h1>
            <p>El panel interno no está disponible en esta dirección pública.</p>
            <p>Los datos originales del taller se conservan en sus fuentes privadas.</p>
          </main></body></html>
          HTML
          printf '%s\n' '{"version":12,"generatedAt":null,"records":[],"expenses":[],"movements":[]}' > _site/data/feed.json
          touch _site/.nojekyll
      - name: Fail closed on any public data or unexpected files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          site = Path('_site')
          expected = {'index.html', 'data/feed.json', '.nojekyll', 'privacy.html', 'oauth/index.html', 'oauth/privacy/index.html'}
          actual = {str(p.relative_to(site)) for p in site.rglob('*') if p.is_file()}
          assert actual == expected, f'Unexpected files: {actual ^ expected}'
          data = json.loads((site / 'data/feed.json').read_text())
          assert set(data) == {'version', 'generatedAt', 'records', 'expenses', 'movements'}
          assert data['records'] == data['expenses'] == data['movements'] == []
          assert data['generatedAt'] is None
          assert all('<script' not in p.read_text().lower() for p in site.rglob('*.html'))
          print('PUBLIC_SECURITY_CONTAINMENT_OK')
          PY
      - name: Upload safe GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
          retention-days: 1
  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy safe public placeholder
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
