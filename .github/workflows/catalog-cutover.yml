name: LITOS M8 Catalog Cutover

on:
  pull_request:
    paths:
      - 'python_catalog/**'
      - '.github/workflows/catalog-cutover.yml'
      - '.github/workflows/catalog-parity.yml'
      - 'apps-script/OperationalCatalog.gs'
  workflow_dispatch:
    inputs:
      mode:
        description: 'M8 mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - canary
          - sync
      confirm:
        description: 'CUTOVER_M8 for canary, SYNC_M8 for production sync'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      GOOGLE_OAUTH_SABAN_JSON: ${{ secrets.GOOGLE_OAUTH_SABAN_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python_catalog/requirements.txt

      - name: Install dependencies
        run: pip install -r python_catalog/requirements.txt

      - name: Compile M8 cutover code
        run: |
          python -m py_compile python_catalog/parity.py
          python -m py_compile python_catalog/sync.py

      - name: Read-only sync preflight
        run: python python_catalog/sync.py --preflight

      - name: Require private OAuth for manual execution
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          test -n "$GOOGLE_OAUTH_SABAN_JSON"
          echo 'OK: private Google OAuth credential present.'

      - name: Manual dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: python python_catalog/sync.py --dry-run

      - name: Confirm canary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'canary' }}
        shell: bash
        run: test "${{ inputs.confirm }}" = 'CUTOVER_M8'

      - name: Canary pre-write parity gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'canary' }}
        run: python python_catalog/parity.py --parity

      - name: Production canary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'canary' }}
        run: python python_catalog/sync.py --canary --confirm CUTOVER_M8

      - name: Post-canary parity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'canary' }}
        run: python python_catalog/parity.py --parity

      - name: Confirm production sync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync' }}
        shell: bash
        run: test "${{ inputs.confirm }}" = 'SYNC_M8'

      - name: Production catalog sync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync' }}
        run: python python_catalog/sync.py --sync --confirm SYNC_M8

      - name: Post-sync parity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync' }}
        run: python python_catalog/parity.py --parity
