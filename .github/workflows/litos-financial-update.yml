name: Apply LITOS financial and production update

on:
  push:
    paths:
      - .github/workflows/litos-financial-update.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dashboard sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {n}")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, new, label):
              text2, n = re.subn(pattern, new, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, found {n}")
              return text2

          # ---- Apps Script feed ----
          p = Path("apps-script/Code.gs")
          s = p.read_text(encoding="utf-8")
          s = once(s,
              '  amount: "Importe trabajo / Debe (€)",\n',
              '  amount: "Importe trabajo / Debe (€)",\n  pvp: "P.V.P. (€)",\n  materialCost: "Coste material est. (€)",\n',
              "feed fields")
          s = once(s, "    version: 4,", "    version: 5,", "feed version")
          s = once(s,
              '      amount: numberOrNull_(read(row, FIELDS.amount)),\n',
              '      amount: numberOrNull_(read(row, FIELDS.amount)),\n      pvp: numberOrNull_(read(row, FIELDS.pvp)),\n      materialCost: numberOrNull_(read(row, FIELDS.materialCost)),\n',
              "feed row economics")
          p.write_text(s, encoding="utf-8")

          # ---- Browser application ----
          p = Path("dist/app.js")
          s = p.read_text(encoding="utf-8")

          s = regex_once(s,
              r'function recordedRevenue\(row\) \{.*?\n\}',
              '''function recordedRevenue(row) {
            const pvp = optionalNumberAt(row, "P.V.P. (€)");
            if (pvp !== null) return pvp;
            return optionalNumberAt(row, "Importe trabajo / Debe (€)");
          }''',
              "recordedRevenue")

          s = once(s,
              '  if (value.includes("gris")) return 55;\n',
              '',
              "remove unconfirmed generic grey price")

          s = once(s,
              '''function numberAt(row, key) {
            const value = row[key];
            return parseNumber(value);
          }''',
              '''function numberAt(row, key) {
            const value = row[key];
            return parseNumber(value);
          }

          function optionalNumberAt(row, key) {
            const value = row[key];
            if (value === null || value === undefined || text(value) === "") return null;
            return parseNumber(value);
          }''',
              "optionalNumberAt")

          s = once(s,
              '    "Importe trabajo / Debe (€)": record.amount ?? "",\n',
              '    "Importe trabajo / Debe (€)": record.amount ?? "",\n    "P.V.P. (€)": record.pvp ?? record.amount ?? "",\n    "Coste material est. (€)": record.materialCost ?? "",\n',
              "public economics mapping")
          s = once(s,
              '    Material: text(record.material),\n',
              '    Material: text(record.material),\n    "Material normalizado": text(record.materialNormalized),\n',
              "public normalized material mapping")
          s = once(s,
              '    "Nota manuscrita": text(record.noteFile)\n',
              '    Notas: text(record.noteFile),\n    "Nota manuscrita": text(record.noteFile),\n    "Imágenes anejas": text(record.attachmentFile)\n',
              "public document mapping")

          helpers = '''function currentQuarterBounds(now = new Date()) {
            const startMonth = Math.floor(now.getMonth() / 3) * 3;
            return {
              start: new Date(now.getFullYear(), startMonth, 1),
              end: new Date(now.getFullYear(), startMonth + 3, 1)
            };
          }

          function currentQuarterLabel(now = new Date()) {
            return `T${Math.floor(now.getMonth() / 3) + 1} ${now.getFullYear()}`;
          }

          function productionReceiptDate(row) {
            return parseDate(row["Fecha recepción (email)"] || row["Fecha ficha"] || row["Fecha para dashboard"]);
          }

          function isInProduction(row, now = new Date()) {
            const receipt = productionReceiptDate(row);
            if (!receipt) return false;
            const { start, end } = currentQuarterBounds(now);
            const hasInvoice = Boolean(text(row["Archivo factura / albarán (XLSX)"]));
            return receipt >= start && receipt < end && !hasInvoice;
          }

          '''
          s = once(s, "function traceRows() {", helpers + "function traceRows() {", "production helpers")

          summary_line = '  $("#summaryCostsFoot").textContent = connected && year ? `Material, consumibles y gastos · ${year}` : "Pendiente de facturas";\n'
          summary_block = summary_line + '''  const productionOrders = new Set(state.rows.filter((row) => isInProduction(row)).map((row) => text(row.Pedido))).size;
            const productionKpi = $("#ordersInProduction");
            productionKpi.textContent = connected ? formatInt.format(productionOrders) : "—";
            productionKpi.closest(".kpi-card")?.classList.toggle("pending-kpi", !connected);
            if (productionKpi.nextElementSibling) {
              productionKpi.nextElementSibling.textContent = connected
                ? `${currentQuarterLabel()} · sin factura/albarán`
                : "Pendiente de actualización";
            }
          '''
          s = once(s, summary_line, summary_block, "production KPI")

          s = regex_once(s,
              r'function estimateMaterial\(rows\) \{.*?return \{ amount, covered, withMeasure \};\n\}',
              '''function estimatedMaterialCostFor(row) {
            const stored = optionalNumberAt(row, "Coste material est. (€)");
            if (stored !== null) return stored;
            const rate = materialRateFor(row);
            if (rate === null) return null;
            const width = numberFromFields(row, ["Ancho total (cm)"], (header) => isSlabMeasureHeader(header, "ancho"));
            const height = writtenHeightFor(row);
            if (width === null || height === null || width <= 0 || height <= 0) return null;
            return (width * height / 10000) * 1.1 * rate;
          }

          function estimateMaterial(rows) {
            let amount = 0;
            let covered = 0;
            let withMeasure = 0;
            rows.forEach((row) => {
              if (sizeDetailsFor(row)) withMeasure += 1;
              const cost = estimatedMaterialCostFor(row);
              if (cost === null) return;
              covered += 1;
              amount += cost;
            });
            return { amount, covered, withMeasure };
          }''',
              "material estimate")

          old_span = s.count("cell.colSpan = 9;")
          if old_span != 2:
              raise SystemExit(f"trace colspan: expected 2, found {old_span}")
          s = s.replace("cell.colSpan = 9;", "cell.colSpan = 12;")

          old_files = '''    [
              order["Archivo factura / albarán (XLSX)"],
              order["Archivo Corel (CDR)"],
              order["Nota manuscrita"]
            ].forEach((url) => {'''
          new_files = '''    [
              recordedRevenue(order),
              estimatedMaterialCostFor(order)
            ].forEach((amount) => {
              const cell = document.createElement("td");
              cell.textContent = amount === null ? "—" : formatMoney(amount);
              row.append(cell);
            });
            [
              order["Archivo factura / albarán (XLSX)"],
              order["Archivo Corel (CDR)"],
              order.Notas || order["Nota manuscrita"],
              order["Imágenes anejas"]
            ].forEach((url) => {'''
          # Normalize indentation in the literal to the file's 4/6-space shape.
          old_files = old_files.replace("            ", "    ")
          new_files = new_files.replace("            ", "    ")
          s = once(s, old_files, new_files, "trace economics/documents")
          p.write_text(s, encoding="utf-8")

          # ---- Static HTML and one-source JS cleanup ----
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = once(s, "min-width: 1120px;", "min-width: 1500px;", "trace width")
          old_header = '<thead><tr><th>ID trabajo</th><th>Recepción (email)</th><th>Documento</th><th>Modelo</th><th>Material</th><th>Medida terminada</th><th>Factura / albarán</th><th>Corel</th><th>Nota</th></tr></thead>'
          new_header = '<thead><tr><th>ID trabajo</th><th>Recepción (email)</th><th>Documento</th><th>Modelo</th><th>Material</th><th>Medida terminada</th><th>P.V.P.</th><th>Coste</th><th>Factura / albarán</th><th>Corel</th><th>Notas</th><th>Imágenes anejas</th></tr></thead>'
          header_count = s.count(old_header)
          if header_count != 2:
              raise SystemExit(f"HTML headers: expected 2, found {header_count}")
          s = s.replace(old_header, new_header)
          colspan_count = s.count('colspan="9"')
          if colspan_count != 2:
              raise SystemExit(f"HTML colspan: expected 2, found {colspan_count}")
          s = s.replace('colspan="9"', 'colspan="12"')
          s = once(s,
              '<div class="kpi-foot">Pendiente de registrar estado</div>',
              '<div class="kpi-foot">Trimestre actual · sin factura/albarán</div>',
              "production foot")
          start = s.index('    <script type="module">')
          end = s.index('</script>', start) + len('</script>')
          s = s[:start] + '    <script type="module" src="./dist/app.js"></script>' + s[end:]
          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate JavaScript and diff
        run: |
          node --check dist/app.js
          git diff --check
          grep -q 'src="./dist/app.js"' index.html
          grep -q 'pvp: "P.V.P. (€)"' apps-script/Code.gs
          grep -q 'function isInProduction' dist/app.js

      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs dist/app.js index.html
          git commit -m "Add current-quarter production and order economics"
          git push
