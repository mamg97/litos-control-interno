name: LITOS Delivery Date Audit · 2026 Corrected Parser

on:
  push:
    paths:
      - '.github/workflows/delivery-date-2026-rerun.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: litos-delivery-date-2026-rerun
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      LITOS_FREE_ONLY: "true"
      LITOS_DELIVERY_READ_WORKERS: "8"
      LITOS_DELIVERY_SCAN_UNLINKED: "true"
      GOOGLE_OAUTH_USER_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_albaranes/requirements.txt
      - run: pip install -r python_albaranes/requirements.txt
      - run: python -m py_compile python_albaranes/delivery_date_backfill.py
      - name: Audit before · 2026
        run: python python_albaranes/delivery_date_backfill.py --dry-run --year 2026
      - name: Repair · 2026
        env:
          LITOS_DELIVERY_DATE_WRITE_ENABLED: "true"
        run: python python_albaranes/delivery_date_backfill.py --sync --year 2026 --confirm DELIVERY_DATE_BACKFILL_V1
      - name: Audit after · 2026
        run: python python_albaranes/delivery_date_backfill.py --dry-run --year 2026
