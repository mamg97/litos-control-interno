name: LITOS Final Price Audit · 2026

on:
  push:
    paths:
      - 'python_albaranes/final_price_2026.py'
      - '.github/workflows/final-price-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: litos-final-price-2026
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      LITOS_FREE_ONLY: "true"
      GOOGLE_OAUTH_USER_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_albaranes/requirements.txt
      - run: pip install -r python_albaranes/requirements.txt
      - name: Compile
        run: python -m py_compile python_albaranes/final_price_2026.py
      - name: Audit 2026
        run: python python_albaranes/final_price_2026.py
      - name: Repair 2026
        run: python python_albaranes/final_price_2026.py --sync
      - name: Verify 2026
        run: python python_albaranes/final_price_2026.py
