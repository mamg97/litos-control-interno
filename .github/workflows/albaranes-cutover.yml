name: LITOS M6 Albaranes Cutover
# Historical delivery repair paused while 2026 is validated.
# Corrected pass prefers differentiated delivery dates and can fall through to PDF.

on:
  push:
    paths:
      - 'python_albaranes/sync.py'
      - 'python_albaranes/parity.py'
      - 'python_albaranes/parity_v2.py'
      - 'python_albaranes/total_parser.py'
      - 'python_albaranes/history_backfill.py'
      - 'python_albaranes/pvp_backfill.py'
      - 'python_albaranes/delivery_date_backfill.py'
      - 'python_albaranes/requirements.txt'
      - '.github/workflows/albaranes-cutover.yml'
  pull_request:
    paths:
      - 'python_albaranes/sync.py'
      - 'python_albaranes/parity.py'
      - 'python_albaranes/parity_v2.py'
      - 'python_albaranes/total_parser.py'
      - 'python_albaranes/history_backfill.py'
      - 'python_albaranes/pvp_backfill.py'
      - 'python_albaranes/delivery_date_backfill.py'
      - 'python_albaranes/requirements.txt'
      - '.github/workflows/albaranes-cutover.yml'
  workflow_run:
    workflows:
      - 'LITOS Draft Sync'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run, canary, sync'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - canary
          - sync
      confirm:
        description: 'Required for writes: CUTOVER_M6 or SYNC_M6'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: litos-m6-v2-${{ github.event_name == 'push' && 'audit' || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  run:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      LITOS_FREE_ONLY: 'true'
      GOOGLE_OAUTH_USER_JSON: ${{ secrets.GOOGLE_OAUTH_USER_JSON }}
      LITOS_ALBARAN_KILL_SWITCH: ${{ vars.LITOS_ALBARAN_KILL_SWITCH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python_albaranes/requirements.txt

      - name: Install dependencies
        run: pip install -r python_albaranes/requirements.txt

      - name: Compile M6 synchronizer
        run: python -m py_compile python_albaranes/parity.py python_albaranes/total_parser.py python_albaranes/parity_v2.py python_albaranes/sync.py python_albaranes/history_backfill.py python_albaranes/pvp_backfill.py python_albaranes/delivery_date_backfill.py

      - name: Fail-closed preflight
        run: python python_albaranes/sync.py --preflight

      - name: Require private OAuth
        shell: bash
        run: |
          test -n "$GOOGLE_OAUTH_USER_JSON"
          echo 'OK: private Google OAuth credential present.'

      - name: Delivery-date read-only audit
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[LITOS-DELIVERY-YEAR-') && !contains(github.event.head_commit.message, '[LITOS-DELIVERY-DATE-BACKFILL]') && !contains(github.event.head_commit.message, '[LITOS-DELIVERY-HISTORICAL-CHAIN]')) || github.event_name == 'workflow_dispatch' }}
        env:
          LITOS_DELIVERY_SCAN_UNLINKED: 'true'
        run: python python_albaranes/delivery_date_backfill.py --dry-run

      - name: Formula-aware read-only parity
        if: ${{ github.event_name == 'push' }}
        working-directory: python_albaranes
        run: python parity_v2.py

      - name: One-time delivery-date historical backfill
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[LITOS-DELIVERY-DATE-BACKFILL]') }}
        env:
          LITOS_DELIVERY_DATE_WRITE_ENABLED: 'true'
          LITOS_DELIVERY_SCAN_UNLINKED: 'true'
        run: python python_albaranes/delivery_date_backfill.py --sync --confirm DELIVERY_DATE_BACKFILL_V1

      - name: Phased delivery-date backfill by year
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[LITOS-DELIVERY-YEAR-') }}
        env:
          LITOS_DELIVERY_DATE_WRITE_ENABLED: 'true'
          LITOS_DELIVERY_SCAN_UNLINKED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          msg='${{ github.event.head_commit.message }}'
          year="$(printf '%s' "$msg" | sed -n 's/.*\[LITOS-DELIVERY-YEAR-\(20[0-9][0-9]\)\].*/\1/p')"
          case "$year" in
            2020|2021|2022|2023|2024|2025|2026) ;;
            *) echo "Invalid or missing phased delivery year"; exit 1 ;;
          esac
          python python_albaranes/delivery_date_backfill.py --dry-run --year "$year"
          python python_albaranes/delivery_date_backfill.py --sync --year "$year" --confirm DELIVERY_DATE_BACKFILL_V1
          python python_albaranes/delivery_date_backfill.py --dry-run --year "$year"

      - name: One-time historical master backfill
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[LITOS-HISTORY-BACKFILL]') }}
        env:
          LITOS_HISTORY_WRITE_ENABLED: 'true'
        run: python python_albaranes/history_backfill.py --sync --confirm HISTORY_BACKFILL_V1

      - name: One-time historical PVP backfill
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[LITOS-PVP-BACKFILL]') }}
        env:
          LITOS_PVP_WRITE_ENABLED: 'true'
        run: python python_albaranes/pvp_backfill.py --sync --confirm PVP_BACKFILL_V1

      - name: Manual read-only dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: python python_albaranes/sync.py --dry-run

      - name: Confirm canary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'canary' }}
        shell: bash
        run: |
          test '${{ inputs.confirm }}' = 'CUTOVER_M6'
          echo 'OK: M6 canary explicitly confirmed.'

      - name: One-row production canary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'canary' }}
        env:
          LITOS_ALBARAN_KILL_SWITCH: 'false'
          LITOS_ALBARAN_WRITE_ENABLED: 'true'
        run: python python_albaranes/sync.py --sync --max-rows 1 --force-rewrite-one

      - name: Post-canary formula-aware parity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'canary' }}
        working-directory: python_albaranes
        run: python parity_v2.py

      - name: Confirm full sync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync' }}
        shell: bash
        run: |
          test '${{ inputs.confirm }}' = 'SYNC_M6'
          echo 'OK: M6 full sync explicitly confirmed.'

      - name: Manual production sync
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync' }}
        env:
          LITOS_ALBARAN_KILL_SWITCH: 'false'
          LITOS_ALBARAN_WRITE_ENABLED: 'true'
        run: python python_albaranes/sync.py --sync --max-rows 0

      - name: Sync definitive delivery dates after manual M6
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync' }}
        env:
          LITOS_DELIVERY_DATE_WRITE_ENABLED: 'true'
          LITOS_DELIVERY_SCAN_UNLINKED: 'true'
        run: python python_albaranes/delivery_date_backfill.py --sync --year 2026 --confirm DELIVERY_DATE_BACKFILL_V1

      - name: Post-manual formula-aware parity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync' }}
        working-directory: python_albaranes
        run: python parity_v2.py

      - name: Bridge sync blocked unless explicitly enabled
        if: ${{ github.event_name == 'workflow_run' && vars.LITOS_ALBARAN_KILL_SWITCH != 'false' }}
        run: echo 'M6 scheduler bridge is disabled by fail-closed kill switch.'

      - name: Bridged production sync from certified Draft Sync schedule
        if: ${{ github.event_name == 'workflow_run' && vars.LITOS_ALBARAN_KILL_SWITCH == 'false' }}
        env:
          LITOS_ALBARAN_WRITE_ENABLED: 'true'
        run: python python_albaranes/sync.py --sync --max-rows 0

      - name: Sync definitive delivery dates after bridged M6
        if: ${{ github.event_name == 'workflow_run' && vars.LITOS_ALBARAN_KILL_SWITCH == 'false' }}
        env:
          LITOS_DELIVERY_DATE_WRITE_ENABLED: 'true'
          LITOS_DELIVERY_SCAN_UNLINKED: 'true'
        run: python python_albaranes/delivery_date_backfill.py --sync --year 2026 --confirm DELIVERY_DATE_BACKFILL_V1

      - name: Post-bridge formula-aware parity
        if: ${{ github.event_name == 'workflow_run' && vars.LITOS_ALBARAN_KILL_SWITCH == 'false' }}
        working-directory: python_albaranes
        run: python parity_v2.py
