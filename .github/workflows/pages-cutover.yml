name: LITOS M7 Pages Cutover

on:
  pull_request:
    paths:
      - 'python_feed/**'
      - '.github/workflows/pages-cutover.yml'
      - 'index.html'
      - 'privacy.html'
      - 'dist/**'
      - 'oauth/**'
  workflow_run:
    workflows:
      - 'LITOS Draft Sync'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'build validates the artifact; deploy publishes it to GitHub Pages'
        required: true
        default: build
        type: choice
        options:
          - build
          - deploy
      confirm:
        description: 'For deploy type CUTOVER_M7'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: litos-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        run: pip install -r python_feed/requirements.txt

      - name: Compile M7 artifact code
        run: |
          python -m py_compile python_feed/feed.py
          python -m py_compile python_feed/export.py
          python -m py_compile python_feed/build_pages.py

      - name: Validate public-feed privacy sanitizer
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=python_feed python - <<'PY'
          from export import FORBIDDEN_PUBLIC_RECORD_KEYS, sanitize_public_payload
          raw = {
              "version": 6,
              "generatedAt": "2026-09-17T00:00:00Z",
              "records": [{
                  "id": "TEST",
                  "model": "Lápida",
                  "invoiceFile": "https://drive.google.com/private-test",
                  "noteFile": "https://drive.google.com/private-note",
              }],
              "expenses": [],
          }
          payload = sanitize_public_payload(raw)
          assert payload["version"] == 7
          assert payload["records"] == [{"id": "TEST", "model": "Lápida"}]
          assert not FORBIDDEN_PUBLIC_RECORD_KEYS.intersection(payload["records"][0])
          print("M7_PUBLIC_PRIVACY_SANITIZER_OK")
          PY

      - name: Validate static-only artifact with synthetic feed
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/m7-synthetic-feed.json" <<'JSON'
          {"version":7,"records":[{"id":"TEST"}],"expenses":[],"generatedAt":"2026-09-17T00:00:00Z"}
          JSON
          python python_feed/build_pages.py --output "$RUNNER_TEMP/m7-site" --feed "$RUNNER_TEMP/m7-synthetic-feed.json"
          test -s "$RUNNER_TEMP/m7-site/index.html"
          test -s "$RUNNER_TEMP/m7-site/dist/app.js"
          test -s "$RUNNER_TEMP/m7-site/data/feed.json"
          grep -Fq 'const STATIC_DATA_FEED_URL = "./data/feed.json";' "$RUNNER_TEMP/m7-site/dist/app.js"
          grep -Fq 'static feed only; no Apps Script runtime dependency' "$RUNNER_TEMP/m7-site/dist/app.js"
          if grep -Fq 'script.google.com' "$RUNNER_TEMP/m7-site/dist/app.js"; then
            echo 'Unexpected Apps Script URL in staged runtime.' >&2
            exit 1
          fi
          if grep -Fq 'LEGACY_DATA_FEED_URL' "$RUNNER_TEMP/m7-site/dist/app.js"; then
            echo 'Unexpected legacy fallback constant in staged runtime.' >&2
            exit 1
          fi

  build:
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main' && vars.LITOS_PUBLIC_FEED_KILL_SWITCH == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      LITOS_FREE_ONLY: 'true'
      GOOGLE_OAUTH_SABAN_JSON: ${{ secrets.GOOGLE_OAUTH_SABAN_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm production deploy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' }}
        shell: bash
        run: |
          test "${{ inputs.confirm }}" = "CUTOVER_M7"
          echo 'OK: explicit M7 deploy confirmation received.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python_feed/requirements.txt

      - name: Install dependencies
        run: pip install -r python_feed/requirements.txt

      - name: Compile M7 artifact code
        run: |
          python -m py_compile python_feed/feed.py
          python -m py_compile python_feed/export.py
          python -m py_compile python_feed/build_pages.py

      - name: Read-only preflight
        run: python python_feed/feed.py --preflight

      - name: Require private OAuth
        shell: bash
        run: |
          test -n "$GOOGLE_OAUTH_SABAN_JSON"
          echo 'OK: private Google OAuth credential present.'

      - name: Generate privacy-sanitized ephemeral public feed
        run: python python_feed/export.py --output "$RUNNER_TEMP/litos-feed.json"

      - name: Build Pages artifact without Git data snapshots
        run: python python_feed/build_pages.py --output _site --feed "$RUNNER_TEMP/litos-feed.json"

      - name: Validate staged site and public-feed privacy
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/dist/app.js
          test -s _site/data/feed.json
          grep -Fq 'const STATIC_DATA_FEED_URL = "./data/feed.json";' _site/dist/app.js
          grep -Fq 'static feed only; no Apps Script runtime dependency' _site/dist/app.js
          if grep -Fq 'script.google.com' _site/dist/app.js; then
            echo 'Unexpected Apps Script URL in staged runtime.' >&2
            exit 1
          fi
          if grep -Fq 'LEGACY_DATA_FEED_URL' _site/dist/app.js; then
            echo 'Unexpected legacy fallback constant in staged runtime.' >&2
            exit 1
          fi
          PYTHONPATH=python_feed python - <<'PY'
          import json
          from pathlib import Path
          from export import FORBIDDEN_PUBLIC_RECORD_KEYS, assert_public_payload_safe
          payload = json.loads(Path('_site/data/feed.json').read_text(encoding='utf-8'))
          assert payload.get('version') == 7
          assert isinstance(payload.get('records'), list) and payload['records']
          assert isinstance(payload.get('expenses'), list)
          for record in payload['records']:
              assert not FORBIDDEN_PUBLIC_RECORD_KEYS.intersection(record)
          assert_public_payload_safe(payload)
          print(
              f"M7_STAGED_SITE_OK records={len(payload['records'])} "
              f"expenses={len(payload['expenses'])} private_document_fields=0"
          )
          PY

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
