name: Apply LITOS final price terminology

on:
  push:
    paths:
      - .github/workflows/litos-final-price.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace PVP with final sheet total
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {n}")
              return text.replace(old, new, 1)

          p = Path('apps-script/Code.gs')
          s = p.read_text(encoding='utf-8')
          s = once(s, '  pvp: "P.V.P. (€)",', '  finalPrice: "Precio final (€)",', 'backend field')
          s = once(s, '      pvp: numberOrNull_(read(row, FIELDS.pvp)),', '      finalPrice: numberOrNull_(read(row, FIELDS.finalPrice)),', 'backend output')
          p.write_text(s, encoding='utf-8')

          p = Path('dist/app.js')
          s = p.read_text(encoding='utf-8')
          old = '''function recordedRevenue(row) {
  const pvp = optionalNumberAt(row, "P.V.P. (€)");
  if (pvp !== null) return pvp;
  return optionalNumberAt(row, "Importe trabajo / Debe (€)");
}'''
          new = '''function recordedFinalPrice(row) {
  return optionalNumberAt(row, "Precio final (€)");
}

function recordedRevenue(row) {
  const finalPrice = recordedFinalPrice(row);
  if (finalPrice !== null) return finalPrice;
  return optionalNumberAt(row, "Importe trabajo / Debe (€)");
}'''
          s = once(s, old, new, 'recorded final price')
          s = once(s, '    "P.V.P. (€)": record.pvp ?? record.amount ?? "",', '    "Precio final (€)": record.finalPrice ?? record.pvp ?? "",', 'public mapping')
          s = once(s, '    recordedRevenue(order),\n    estimatedMaterialCostFor(order)', '    recordedFinalPrice(order),\n    estimatedMaterialCostFor(order)', 'trace price')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          n = s.count('<th>P.V.P.</th>')
          if n != 2:
              raise SystemExit(f'index headers: expected 2, found {n}')
          s = s.replace('<th>P.V.P.</th>', '<th>Precio final</th>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check dist/app.js
          git diff --check
          grep -q 'finalPrice: "Precio final (€)"' apps-script/Code.gs
          grep -q '"Precio final (€)": record.finalPrice' dist/app.js
          test "$(grep -o '<th>Precio final</th>' index.html | wc -l)" -eq 2

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs dist/app.js index.html
          git commit -m "Use final sheet total as order price"
          git push
