name: LITOS Handwriting Readonly

on:
  push:
    paths:
      - 'python_handwriting/**'
      - '.github/workflows/handwriting-readonly.yml'
  pull_request:
    paths:
      - 'python_handwriting/**'
      - '.github/workflows/handwriting-readonly.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - dry-run
          - gemini-canary

permissions:
  contents: read

concurrency:
  group: litos-handwriting-readonly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python_handwriting
    env:
      PYTHONUNBUFFERED: "1"
      LITOS_FREE_ONLY: "true"
      LITOS_HANDWRITING_WRITE_ENABLED: "false"
      LITOS_SPREADSHEET_ID: "1ZS-L0eJmfukNr0rmc8ZvC3UxdVKw7Rnggx5TlRydZ2Q"
      LITOS_GEMINI_MODEL: "gemini-3.8-flash"
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_handwriting/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read-only preflight
        run: python runner.py --preflight

      - name: Require private Google credential
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.mode == 'gemini-canary') }}
        shell: bash
        run: |
          test -n "$GOOGLE_OAUTH_CLIENT_JSON"
          echo "OK: private Google credential is present."

      - name: Fresh handwriting state dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: python runner.py --dry-run

      - name: One-call Gemini read-only canary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'gemini-canary' }}
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY"
          python gemini_canary.py
