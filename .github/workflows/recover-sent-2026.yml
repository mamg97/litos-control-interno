name: LITOS 2026 Sent Recovery + Delivery Reconcile
# Targeted unresolved-ID retry.
# Phase 1: August-September 2026.

on:
  push:
    paths:
      - '.github/workflows/recover-sent-2026.yml'
      - 'python_client_intake/recover_sent_2026.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: litos-recover-sent-2026
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      LITOS_FREE_ONLY: "true"
      LITOS_CLIENT_WRITE_ENABLED: "true"
      LITOS_INTAKE_EMERGENCY_KILL_SWITCH: "false"
      LITOS_SPREADSHEET_ID: "1ZS-L0eJmfukNr0rmc8ZvC3UxdVKw7Rnggx5TlRydZ2Q"
      LITOS_CLIENT_FOLDER_ID: "1eUAupqLzfBhkiEexWqpI3JtYReT8c9A_"
      LITOS_CLIENT_YEAR: "2026"
      LITOS_CLIENT_LOOKBACK_DAYS: "365"
      LITOS_DELIVERY_DATE_WRITE_ENABLED: "true"
      LITOS_DELIVERY_SCAN_UNLINKED: "true"
      LITOS_DELIVERY_READ_WORKERS: "8"
      GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
      GOOGLE_OAUTH_USER_JSON: ${{ secrets.GOOGLE_OAUTH_USER_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install M3 dependencies
        run: pip install -r python_client_intake/requirements.txt

      - name: Recover sent attachments for known 2026 work IDs
        working-directory: python_client_intake
        run: python recover_sent_2026.py

      - name: Install M6 dependencies
        run: pip install -r python_albaranes/requirements.txt

      - name: Reconcile 2026 delivery dates after recovery
        working-directory: python_albaranes
        run: python delivery_date_backfill.py --sync --year 2026 --confirm DELIVERY_DATE_BACKFILL_V1

      - name: Final 2026 delivery audit
        working-directory: python_albaranes
        run: python delivery_date_backfill.py --dry-run --year 2026
