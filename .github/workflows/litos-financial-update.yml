name: Apply LITOS financial and production update

on:
  push:
    paths:
      - .github/workflows/litos-financial-update.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dashboard sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          # Apps Script public feed: expose only the two new operational numbers.
          path = Path("apps-script/Code.gs")
          source = path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '  amount: "Importe trabajo / Debe (€)",\n',
              '  amount: "Importe trabajo / Debe (€)",\n  pvp: "P.V.P. (€)",\n  materialCost: "Coste material est. (€)",\n',
              "Code.gs fields",
          )
          source = replace_once(source, "    version: 4,", "    version: 5,", "feed version")
          source = replace_once(
              source,
              '      amount: numberOrNull_(read(row, FIELDS.amount)),\n',
              '      amount: numberOrNull_(read(row, FIELDS.amount)),\n      pvp: numberOrNull_(read(row, FIELDS.pvp)),\n      materialCost: numberOrNull_(read(row, FIELDS.materialCost)),\n',
              "Code.gs row payload",
          )
          path.write_text(source, encoding="utf-8")

          # Browser application.
          path = Path("dist/app.js")
          source = path.read_text(encoding="utf-8")

          old = '''function recordedRevenue(row) {
            const raw = row["Importe trabajo / Debe (€)"];
            if (raw === null || raw === undefined || text(raw) === "") return null;
            return numberAt(row, "Importe trabajo / Debe (€)");
          }'''
          new = '''function recordedRevenue(row) {
            const pvp = optionalNumberAt(row, "P.V.P. (€)");
            if (pvp !== null) return pvp;
            return optionalNumberAt(row, "Importe trabajo / Debe (€)");
          }'''
          source = replace_once(source, old, new, "recordedRevenue")

          source = replace_once(
              source,
              '  if (value.includes("gris")) return 55;\n  return null;',
              '  return null;',
              "remove unconfirmed generic grey price",
          )

          old = '''function numberAt(row, key) {
            const value = row[key];
            return parseNumber(value);
          }'''
          new = '''function numberAt(row, key) {
            const value = row[key];
            return parseNumber(value);
          }

          function optionalNumberAt(row, key) {
            const value = row[key];
            if (value === null || value === undefined || text(value) === "") return null;
            return parseNumber(value);
          }'''
          source = replace_once(source, old, new, "optionalNumberAt")

          old = '''    "Importe trabajo / Debe (€)": record.amount ?? "",
              "Estado pedido": text(record.status),
              Modelo: text(record.model),
              Material: text(record.material),'''
          new = '''    "Importe trabajo / Debe (€)": record.amount ?? "",
              "P.V.P. (€)": record.pvp ?? record.amount ?? "",
              "Coste material est. (€)": record.materialCost ?? "",
              "Estado pedido": text(record.status),
              Modelo: text(record.model),
              Material: text(record.material),
              "Material normalizado": text(record.materialNormalized),'''
          source = replace_once(source, old, new, "mapPublicRows financial fields")

          old = '''    "Archivo factura / albarán (XLSX)": text(record.invoiceFile),
              "Archivo Corel (CDR)": text(record.corelFile),
              "Nota manuscrita": text(record.noteFile)
            })).filter((row) => row.Pedido);'''
          new = '''    "Archivo factura / albarán (XLSX)": text(record.invoiceFile),
              "Archivo Corel (CDR)": text(record.corelFile),
              Notas: text(record.noteFile),
              "Nota manuscrita": text(record.noteFile),
              "Imágenes anejas": text(record.attachmentFile)
            })).filter((row) => row.Pedido);'''
          source = replace_once(source, old, new, "mapPublicRows document fields")

          marker = '''function traceRows() {
            return [...state.rows].sort((a, b) => {'''
          insertion = '''function currentQuarterBounds(now = new Date()) {
            const startMonth = Math.floor(now.getMonth() / 3) * 3;
            return {
              start: new Date(now.getFullYear(), startMonth, 1),
              end: new Date(now.getFullYear(), startMonth + 3, 1)
            };
          }

          function currentQuarterLabel(now = new Date()) {
            return `T${Math.floor(now.getMonth() / 3) + 1} ${now.getFullYear()}`;
          }

          function productionReceiptDate(row) {
            return parseDate(row["Fecha recepción (email)"] || row["Fecha ficha"] || row["Fecha para dashboard"]);
          }

          function isInProduction(row, now = new Date()) {
            const receipt = productionReceiptDate(row);
            if (!receipt) return false;
            const { start, end } = currentQuarterBounds(now);
            const hasInvoice = Boolean(text(row["Archivo factura / albarán (XLSX)"]));
            return receipt >= start && receipt < end && !hasInvoice;
          }

          function traceRows() {
            return [...state.rows].sort((a, b) => {'''
          source = replace_once(source, marker, insertion, "current-quarter production helpers")

          summary_marker = '''  $("#summaryCostsFoot").textContent = connected && year ? `Material, consumibles y gastos · ${year}` : "Pendiente de facturas";
            $("#measuredOrders").textContent = connected ? formatInt.format(s.measured) : "—";'''
          summary_new = '''  $("#summaryCostsFoot").textContent = connected && year ? `Material, consumibles y gastos · ${year}` : "Pendiente de facturas";
            const productionOrders = new Set(state.rows.filter((row) => isInProduction(row)).map((row) => text(row.Pedido))).size;
            const productionKpi = $("#ordersInProduction");
            productionKpi.textContent = connected ? formatInt.format(productionOrders) : "—";
            productionKpi.closest(".kpi-card")?.classList.toggle("pending-kpi", !connected);
            if (productionKpi.nextElementSibling) {
              productionKpi.nextElementSibling.textContent = connected
                ? `${currentQuarterLabel()} · sin factura/albarán`
                : "Pendiente de actualización";
            }
            $("#measuredOrders").textContent = connected ? formatInt.format(s.measured) : "—";'''
          source = replace_once(source, summary_marker, summary_new, "renderSummary production KPI")

          old = '''function estimateMaterial(rows) {
            let amount = 0;
            let covered = 0;
            let withMeasure = 0;
            rows.forEach((row) => {
              const size = sizeDetailsFor(row);
              const rate = materialRateFor(row);
              if (!size) return;
              withMeasure += 1;
              if (rate === null) return;
              covered += 1;
              const width = numberFromFields(row, ["Ancho total (cm)"], (header) => isSlabMeasureHeader(header, "ancho"));
              const height = writtenHeightFor(row);
              if (width === null || height === null) return;
              amount += (width * height / 10000) * 1.1 * rate;
            });
            return { amount, covered, withMeasure };
          }'''
          new = '''function estimatedMaterialCostFor(row) {
            const stored = optionalNumberAt(row, "Coste material est. (€)");
            if (stored !== null) return stored;
            const rate = materialRateFor(row);
            if (rate === null) return null;
            const width = numberFromFields(row, ["Ancho total (cm)"], (header) => isSlabMeasureHeader(header, "ancho"));
            const height = writtenHeightFor(row);
            if (width === null || height === null || width <= 0 || height <= 0) return null;
            return (width * height / 10000) * 1.1 * rate;
          }

          function estimateMaterial(rows) {
            let amount = 0;
            let covered = 0;
            let withMeasure = 0;
            rows.forEach((row) => {
              if (sizeDetailsFor(row)) withMeasure += 1;
              const cost = estimatedMaterialCostFor(row);
              if (cost === null) return;
              covered += 1;
              amount += cost;
            });
            return { amount, covered, withMeasure };
          }'''
          source = replace_once(source, old, new, "material estimate from master row")

          source = source.replace("    cell.colSpan = 9;", "    cell.colSpan = 12;")
          if source.count("cell.colSpan = 12;") != 2:
              raise SystemExit("trace colspan: expected exactly 2 updated occurrences")

          old = '''    [
              order["Archivo factura / albarán (XLSX)"],
              order["Archivo Corel (CDR)"],
              order["Nota manuscrita"]
            ].forEach((url) => {'''
          new = '''    [
              recordedRevenue(order),
              estimatedMaterialCostFor(order)
            ].forEach((amount) => {
              const cell = document.createElement("td");
              cell.textContent = amount === null ? "—" : formatMoney(amount);
              row.append(cell);
            });
            [
              order["Archivo factura / albarán (XLSX)"],
              order["Archivo Corel (CDR)"],
              order.Notas || order["Nota manuscrita"],
              order["Imágenes anejas"]
            ].forEach((url) => {'''
          source = replace_once(source, old, new, "trace financial and document columns")

          path.write_text(source, encoding="utf-8")

          # Static HTML: add table headings and use the single external JS file.
          path = Path("index.html")
          source = path.read_text(encoding="utf-8")
          source = replace_once(source, "min-width: 1120px;", "min-width: 1500px;", "trace table width")
          old_header = '<thead><tr><th>ID trabajo</th><th>Recepción (email)</th><th>Documento</th><th>Modelo</th><th>Material</th><th>Medida terminada</th><th>Factura / albarán</th><th>Corel</th><th>Nota</th></tr></thead>'
          new_header = '<thead><tr><th>ID trabajo</th><th>Recepción (email)</th><th>Documento</th><th>Modelo</th><th>Material</th><th>Medida terminada</th><th>P.V.P.</th><th>Coste</th><th>Factura / albarán</th><th>Corel</th><th>Notas</th><th>Imágenes anejas</th></tr></thead>'
          if source.count(old_header) != 2:
              raise SystemExit(f"HTML trace headers: expected 2, found {source.count(old_header)}")
          source = source.replace(old_header, new_header)
          initial_colspans = source.count('colspan="9"')
          if initial_colspans != 2:
              raise SystemExit(f"HTML initial colspan: expected 2, found {initial_colspans}")
          source = source.replace('colspan="9"', 'colspan="12"')
          source = replace_once(
              source,
              '<div class="kpi-foot">Pendiente de registrar estado</div>',
              '<div class="kpi-foot">Trimestre actual · sin factura/albarán</div>',
              "production KPI static foot",
          )
          start = source.index('    <script type="module">')
          end = source.index('</script>', start) + len('</script>')
          source = source[:start] + '    <script type="module" src="./dist/app.js"></script>' + source[end:]
          path.write_text(source, encoding="utf-8")
          PY

      - name: Validate JavaScript and diff
        run: |
          node --check dist/app.js
          git diff --check
          grep -q 'src="./dist/app.js"' index.html
          grep -q 'pvp: "P.V.P. (€)"' apps-script/Code.gs

      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs dist/app.js index.html
          git commit -m "Add current-quarter production and order economics"
          git push
